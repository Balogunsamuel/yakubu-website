<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1a2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a9bbf"/>
      <stop offset="100%" style="stop-color:#1f7a99"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Abstract shapes -->
  <circle cx="650" cy="100" r="150" fill="#2a9bbf" opacity="0.1"/>
  <circle cx="100" cy="500" r="200" fill="#e11d2e" opacity="0.08"/>

  <!-- Document/Chart visual -->
  <g transform="translate(250, 150)">
    <!-- Main document -->
    <rect x="0" y="0" width="300" height="350" rx="12" fill="#1a2942" stroke="#2a9bbf" stroke-width="2"/>

    <!-- Header bar -->
    <rect x="20" y="20" width="260" height="40" rx="6" fill="#2a9bbf" opacity="0.2"/>

    <!-- Chart bars -->
    <rect x="40" y="100" width="40" height="120" rx="4" fill="#e11d2e"/>
    <rect x="100" y="80" width="40" height="140" rx="4" fill="#2a9bbf"/>
    <rect x="160" y="60" width="40" height="160" rx="4" fill="#e11d2e"/>
    <rect x="220" y="40" width="40" height="180" rx="4" fill="#2a9bbf"/>

    <!-- Lines -->
    <rect x="40" y="250" width="180" height="8" rx="4" fill="#2a9bbf" opacity="0.3"/>
    <rect x="40" y="270" width="140" height="8" rx="4" fill="#2a9bbf" opacity="0.2"/>
    <rect x="40" y="290" width="200" height="8" rx="4" fill="#2a9bbf" opacity="0.25"/>
    <rect x="40" y="310" width="100" height="8" rx="4" fill="#2a9bbf" opacity="0.15"/>
  </g>

  <!-- Floating elements -->
  <circle cx="180" cy="200" r="40" fill="#2a9bbf" opacity="0.15"/>
  <circle cx="620" cy="400" r="30" fill="#e11d2e" opacity="0.12"/>

  <!-- Decorative line -->
  <path d="M0 580 Q200 550 400 570 Q600 590 800 560" stroke="#2a9bbf" stroke-width="2" fill="none" opacity="0.3"/>
</svg>
